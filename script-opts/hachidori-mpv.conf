# hachidori-mpv settings. The easiest way to change them is the plugin's
# Settings window (Alt+o in mpv), which writes this file. Lines starting with
# # are defaults; remove the # and change the value to override one.
# Dictionaries, lookups, the popup and your Anki Templates come from the
# Hachidori you share from your browser: change them in Hachidori's Settings
# (Alt+Shift+h in mpv).

# Start the overlay when a file with a subtitle track loads.
#autostart=yes
# Hide mpv's own primary subtitles while the overlay draws them.
#hide_mpv_subs=yes
# Pause while the pointer is over a subtitle or a popup is open.
#pause_on_hover=yes
# Link to the sharing Hachidori on this computer the first time.
#auto_link=yes

# Keys while the overlay is on (mpv key names; empty turns one off). When the
# overlay is off, mpv's own bindings for these keys come back.
# Previous/next subtitle line:
#key_prev_sub=LEFT
#key_next_sub=RIGHT
# Repeat the current line until pressed again (an A-B loop over the line,
# padded like the sentence audio); previous/next move the loop along:
#key_repeat=r

# Subtitle appearance. Sizes are percentages of the video window's height.
# For anything else, put CSS in script-opts/hachidori-mpv.css (#subtitle).
#font_family=Noto Sans CJK JP, Noto Sans JP, Yu Gothic UI, Meiryo, Hiragino Sans, sans-serif
#font_size=5.6
#font_weight=600
#font_color=#ffffff
#outline_color=#000000
#outline_size=0.28
#background_color=transparent
#bottom_margin=5.5
#max_width=90

# Anki media from mpv. Hachidori adds the note with your Template exactly as
# in the browser; then mpv fills the Template's {screenshot}/{gif} fields with
# the video frame and its {sentence-audio} field (or the blank SentenceAudio
# field of Kiku, Lapis and Senren) with the subtitle line's audio.
#fill_screenshot=yes
#fill_sentence_audio=yes
# Still picture: the frame on screen when you mine (webp, jpg, avif or png).
#screenshot_format=webp
#screenshot_height=480
#screenshot_quality=80
# Animated picture instead, with Anki Miner's settings: avif (smaller) or
# webp (broader Anki client support; avif falls back to it when ffmpeg has no
# SVT-AV1). The clip starts at the subtitle and lasts clip_duration seconds,
# never longer than the subtitle; match_audio (or a clip_duration of 0) spans
# the sentence audio instead. Size presets (fps/height/quality): Small
# 12/480/30, Balanced 20/720/30, High 24/1080/50.
#screenshot_animated=no
#screenshot_animated_format=avif
#screenshot_animated_clip_duration=2.0
#screenshot_animated_match_audio=no
#screenshot_animated_fps=20
#screenshot_animated_height=720
#screenshot_animated_quality=30
# opus (in .ogg) or mp3
#audio_format=opus
#audio_bitrate=64k
#audio_pad_start=0.15
#audio_pad_end=0.25
# Field names that replace the Template's own choice. Empty: use the Template.
#screenshot_field=
#sentence_audio_field=

# Empty: ffmpeg next to mpv, then ffmpeg on PATH.
#ffmpeg_path=
# Empty: the AnkiConnect address and key your Hachidori uses.
#ankiconnect_url=
#ankiconnect_key=
# The Hachidori Relay's Yomitan-compatible API (Relay v0.0.5+), used to read
# which fields your Templates map to {screenshot} and {sentence-audio}.
#relay_api_url=http://127.0.0.1:19633

# Empty: the Electron the installer downloaded.
#electron_path=
# Open the overlay's developer tools.
#debug=no
